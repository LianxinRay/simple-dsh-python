[project]
name = "simple-dsh-python"
version = "0.1.0"
description = "A minimal Python port of the DeepSeek Harness P0 agent spine (cordis runtime, llm vocabulary, session log, prompt assembly, tool pipeline, agent loop)."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simple_dsh*"]
